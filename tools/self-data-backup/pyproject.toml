[project]
name = "fitness-coach-self-data-backup"
version = "0.1.0"
description = "Local rclone adapter for fitness-coach personal-data backups."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.16.0,<1.0.0",
]

[project.scripts]
self-data-backup = "fitness_coach_self_data_backup.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
