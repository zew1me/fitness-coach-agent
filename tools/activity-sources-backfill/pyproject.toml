[project]
name = "fitness-coach-activity-sources-backfill"
version = "0.1.0"
description = "Operator CLI for the resumable Phase 1 activity-source backfill."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1,<0.29.0", "pydantic>=2.10.6,<3.0.0", "typer>=0.24,<0.28"]

[project.scripts]
activity-sources-backfill = "fitness_coach_activity_sources_backfill.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
